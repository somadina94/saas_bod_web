# Production stack for EC2 / VPS — used by ./deploy.sh (project: saasbod-web-vps)
#
# Normal deploy: image from GHCR (built in GitHub Actions). VPS only pulls.
# The `build:` block is for DEPLOY_BUILD_LOCAL=1 fallback only.

name: saasbod-web-vps

services:
  web:
    image: ${SAASBOD_WEB_IMAGE:-ghcr.io/somadina94/saas_bod_web:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: saasbod-web
    ports:
      - "6621:6621"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NODE_ENV: production
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - saasbod-web-vps-network

networks:
  saasbod-web-vps-network:
    driver: bridge
